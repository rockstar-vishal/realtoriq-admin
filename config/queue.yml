default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Photo copying is its own queue so a long download cannot sit on the
    # threads that send follow-up reminders and enquiry alerts.
    - queues: [default, mailers]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    - queues: marketplace_assets
      threads: 1
      processes: 1
      polling_interval: 1
    # Match curation is its own queue so a slow firm cannot sit on the
    # threads that send follow-up reminders.
    - queues: matching
      threads: 5
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

staging:
  <<: *default

production:
  <<: *default
