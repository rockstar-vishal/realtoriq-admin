staging:
  dispatch_due_followups:
    class: Notifications::DispatchDueFollowupsJob
    schedule: every minute
  facebook_import_sweeper:
    class: Facebook::ImportSweeperJob
    schedule: every 5 minutes
  facebook_import_failure_digest:
    class: Facebook::ImportFailureDigestJob
    schedule: every minute
  facebook_token_health_check:
    class: Facebook::TokenHealthCheckJob
    schedule: at 2am every Sunday
  facebook_cleanup:
    class: Facebook::CleanupJob
    schedule: at 3am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  dispatch_due_followups:
    class: Notifications::DispatchDueFollowupsJob
    schedule: every minute
  facebook_import_sweeper:
    class: Facebook::ImportSweeperJob
    schedule: every 5 minutes
  facebook_import_failure_digest:
    class: Facebook::ImportFailureDigestJob
    schedule: every minute
  facebook_token_health_check:
    class: Facebook::TokenHealthCheckJob
    schedule: at 2am every Sunday
  facebook_cleanup:
    class: Facebook::CleanupJob
    schedule: at 3am every day
