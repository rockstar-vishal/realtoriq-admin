$kind: http-request
description: |-
  Accepts any format of the number — `9820144210`, `+91 98201 44210`, `098201 44210` all resolve to the same user, because mobiles are normalised to E.164 and are globally unique.

  Saves `request_id` for the next request.
url: "{{api_base}}/auth/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "mobile": "{{super_admin_mobile}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const body = pm.response.json();
      pm.collectionVariables.set("request_id", body.request_id);

      pm.test("returns a request_id to verify against", () => {
        pm.expect(body.request_id).to.be.a("string").and.not.empty;
      });

      pm.test("masks the destination, for the OTP screen's copy", () => {
        pm.expect(body.sent_to).to.include("xxx");
      });

      pm.test("code has not already expired", () => {
        pm.expect(body.expires_in).to.be.above(0);
      });
    language: text/javascript
order: 1000
