$kind: http-request
description: Refused deliberately. A cancelled booking with no reason is one nobody can learn from.
url: "{{api_base}}/bookings/{{booking_id}}/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("422 reason_required", () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().error.code).to.eql("reason_required");
      });
    language: text/javascript
order: 8000
