$kind: http-request
description: "The detail the design's tabs are built from: the itemised `revenue` block, documents, invoices and collections, plus `invoiced` / `collected` / `outstanding`."
url: "{{api_base}}/bookings/{{booking_id}}"
method: GET
scripts:
  - type: afterResponse
    code: pm.test("200 OK", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
