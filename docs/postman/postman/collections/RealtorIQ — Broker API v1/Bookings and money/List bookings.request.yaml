$kind: http-request
description: |-
  Cancelled bookings are excluded unless you ask for them — the design says cancelling "removes this booking from revenue".

  Filters: `q`, `client_phone`, `project_id`, `booked_from`, `booked_to`, `status`.

  `totals` carries the firm's live agreement value and net income for the header.
url: "{{api_base}}/bookings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      pm.test("carries live totals", () => {
        pm.expect(pm.response.json().totals).to.have.property("net_income");
      });
    language: text/javascript
order: 2000
