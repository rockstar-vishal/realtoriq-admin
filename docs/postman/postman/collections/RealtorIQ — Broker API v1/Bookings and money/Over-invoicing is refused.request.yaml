$kind: http-request
description: A firm cannot invoice more than it earned. The refusal carries `net_income`, `already_invoiced`, `attempted` and `available`, so the app can say how much is left rather than just refusing.
url: "{{api_base}}/bookings/{{booking_id}}/invoices"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "number": "INV-2026-042",
      "issued_on": "2026-08-05",
      "amount": 100000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("422 over_invoiced with the arithmetic", () => {
        pm.response.to.have.status(422);
        const e = pm.response.json().error;
        pm.expect(e.code).to.eql("over_invoiced");
        pm.expect(e.details).to.have.property("available");
      });
    language: text/javascript
order: 5000
