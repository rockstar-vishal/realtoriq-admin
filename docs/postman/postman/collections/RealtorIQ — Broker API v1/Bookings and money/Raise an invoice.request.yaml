$kind: http-request
description: |-
  The number is **entered by the broker**, not generated, so it matches the invoice they actually raised. Unique per firm.

  Capped at net income — see the next request.

  The number carries `{{$timestamp}}` because it is unique per firm. A fixed one 422s on the second run — and because each run creates a fresh booking, that left the next request with nothing invoiced and the over-invoicing check passed when it should have failed. Exactly the cascade running the collection is meant to catch.
url: "{{api_base}}/bookings/{{booking_id}}/invoices"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "number": "INV-{{$timestamp}}",
      "issued_on": "2026-08-04",
      "amount": 686000,
      "comment": "full brokerage"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));

      const body = pm.response.json();
      pm.collectionVariables.set("invoice_id", body.invoice.id);

      pm.test("the booking now shows it as invoiced", () => {
        pm.expect(body.booking.invoiced).to.eql(686000);
        pm.expect(body.booking.outstanding).to.eql(686000);
      });
    language: text/javascript
order: 4000
