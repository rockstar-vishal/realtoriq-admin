$kind: http-request
description: |-
  Modes: `neft_rtgs`, `upi`, `cheque`, `cash`.

  `invoice_id` is optional — omit it for the design's "Unlinked payment". Attach proof by passing `proof_signed_id` from `POST /uploads` with purpose `collection_proof`.
url: "{{api_base}}/bookings/{{booking_id}}/collections"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "invoice_id": "{{invoice_id}}",
      "received_on": "2026-08-18",
      "amount": 400000,
      "transaction_no": "8842190",
      "mode": "neft_rtgs"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));

      const b = pm.response.json().booking;
      pm.test("outstanding is invoiced minus collected", () => {
        pm.expect(b.collected).to.eql(400000);
        pm.expect(b.outstanding).to.eql(b.invoiced - b.collected);
      });
    language: text/javascript
order: 6000
