$kind: http-request
description: |-
  Only the firm's `super_admin` may act on channels. Reading them still works for everyone — the split is enforced server-side, not in the client.

  Self-contained: the pre-request script signs in as the agent and uses that token, so this holds in a full collection run where you are otherwise the super admin.
url: "{{api_base}}/firm/contact_channels/{{channel_id}}/request_code"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{agent_access_token}}"
scripts:
  - type: beforeRequest
    code: |-
      // Sign in as the agent, so this request is genuinely made by one.
      const api = pm.variables.replaceIn("{{api_base}}");
      const mobile = pm.variables.replaceIn("{{agent_mobile}}");
      const code = pm.variables.replaceIn("{{otp_code}}");

      const json = (body) => ({
        mode: "raw", raw: JSON.stringify(body)
      });

      pm.sendRequest({
        url: api + "/auth/otp",
        method: "POST",
        header: { "Content-Type": "application/json" },
        body: json({ mobile })
      }, (err, res) => {
        if (err || res.code !== 200) { return; }

        pm.sendRequest({
          url: api + "/auth/verify",
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: json({ request_id: res.json().request_id, code })
        }, (err2, res2) => {
          if (!err2 && res2.code === 200) {
            pm.collectionVariables.set("agent_access_token", res2.json().access_token);
          }
        });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("403 forbidden_role when not the super admin", () => {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().error.code).to.eql("forbidden_role");
      });
    language: text/javascript
order: 4000
