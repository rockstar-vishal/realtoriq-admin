$kind: http-request
description: Also what a revoked session returns — the session is checked on every request, so signing a device out takes effect immediately rather than when its JWT expires.
url: "{{api_base}}/me"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("401 unauthorized", () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error.code).to.eql("unauthorized");
      });
    language: text/javascript
order: 3000
