$kind: http-request
description: "Said plainly, because there is no self-signup: a stranger learning a number isn't registered gains nothing they can act on. The design's \"This number isn't registered\" wall."
url: "{{api_base}}/auth/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "mobile": "9000000000"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("404 with a typed code", () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error.code).to.eql("not_registered");
      });
    language: text/javascript
order: 1000
