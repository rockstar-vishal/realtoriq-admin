$kind: http-request
description: |-
  `can_verify` tells the client whether to render the verify actions at all.

  Saves an **unverified** channel's id for the next two requests — `demo:seed` leaves WhatsApp unverified on purpose so the flow is walkable on a fresh database.
url: "{{api_base}}/firm/contact_channels"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const body = pm.response.json();

      // Prefer an unverified channel: sending a code to an already-verified
      // one is refused, which would make a second collection run fail.
      const target = body.channels.find((c) => !c.verified) || body.channels[0];
      if (target) pm.collectionVariables.set("channel_id", target.id);

      pm.test("returns one channel of each kind", () => {
        pm.expect(body.channels.map((c) => c.kind).sort())
          .to.eql(["email", "mobile", "whatsapp"]);
      });

      pm.test("tells the client whether this user may verify", () => {
        pm.expect(body.can_verify).to.be.a("boolean");
      });
    language: text/javascript
order: 1000
