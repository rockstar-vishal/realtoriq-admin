$kind: http-request
description: |-
  Routes by channel kind: email through Action Mailer, mobile and WhatsApp through MSG91.

  There is a 60-second resend cooldown — call it twice quickly and the second returns 422 `code_not_sent`. An already-verified channel is refused the same way, which is why the assertions below accept both outcomes: it keeps repeat runs honest instead of green-by-luck.
url: "{{api_base}}/firm/contact_channels/{{channel_id}}/request_code"
method: POST
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("code sent, or refused for a stated reason", () => {
        pm.expect([200, 422]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
        pm.test("channel moves to pending", () => {
          pm.expect(pm.response.json().channel.state).to.eql("pending");
        });
      } else {
        pm.test("refusal is typed", () => {
          pm.expect(pm.response.json().error.code).to.eql("code_not_sent");
        });
      }
    language: text/javascript
order: 2000
