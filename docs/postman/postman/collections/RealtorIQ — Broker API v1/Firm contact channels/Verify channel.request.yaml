$kind: http-request
description: |-
  Records **who** verified it, so the admin panel can show "verified by Tanmay Sethi" rather than just a green badge.

  A wrong code returns 422 `invalid_code` with `details.attempts_left`; the channel fails after five.

  Re-run `bin/rails demo:seed` to put the demo firm's WhatsApp channel back to unverified.
url: "{{api_base}}/firm/contact_channels/{{channel_id}}/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "{{otp_code}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("verified, or no live code to verify against", () => {
        pm.expect([200, 422]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
        pm.test("channel is verified, and by whom", () => {
          const channel = pm.response.json().channel;
          pm.expect(channel.verified).to.be.true;
          pm.expect(channel.verified_at).to.not.be.null;
        });
      }
    language: text/javascript
order: 3000
