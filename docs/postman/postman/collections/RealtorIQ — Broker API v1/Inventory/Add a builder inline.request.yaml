$kind: http-request
description: |-
  The design puts this on the project form so a broker is never blocked by a missing developer.

  What they add belongs to their firm alone — it does not join the global list, and a firm may reuse a name the platform already has.

  The name carries `{{$timestamp}}` so the collection is re-runnable — builder names are unique per firm, and a fixed one would 422 on the second pass.
url: "{{api_base}}/builders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Sethi Preferred {{$timestamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));

      pm.test("belongs to the firm, not the platform", () => {
        pm.expect(pm.response.json().builder.global).to.be.false;
      });
    language: text/javascript
order: 2000
