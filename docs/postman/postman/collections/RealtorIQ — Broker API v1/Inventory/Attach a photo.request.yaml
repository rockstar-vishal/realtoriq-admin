$kind: http-request
description: |-
  Photos live on the detail screen, not the create form — the design is explicit about that.

  Three steps: `POST /uploads` for a ticket, PUT the file to the returned url, then send the `signed_id` here. Attaching before the PUT lands returns `upload_incomplete`.

  The pre-request script does the first two steps, so this request works on its own.
url: "{{api_base}}/properties/{{property_id}}/photos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "photo_signed_ids": [
        "{{signed_id}}"
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      // Ticket, then PUT the file — what a client does before attaching.
      const api = pm.variables.replaceIn("{{api_base}}");
      const token = pm.variables.replaceIn("{{access_token}}");

      pm.sendRequest({
        url: api + "/uploads",
        method: "POST",
        header: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: { mode: "raw", raw: JSON.stringify({
          purpose: "property_photo", filename: "flat.txt", byte_size: 11,
          checksum: "XrY7u+Ae7tCTyyK7j1rNww==", content_type: "image/png"
        }) }
      }, (err, res) => {
        if (err || res.code !== 201) { return; }
        const ticket = res.json();
        pm.collectionVariables.set("signed_id", ticket.signed_id);

        pm.sendRequest({
          url: ticket.direct_upload.url,
          method: "PUT",
          header: ticket.direct_upload.headers,
          body: { mode: "raw", raw: "hello world" }
        }, () => {});
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));

      pm.test("photo is attached and becomes the cover", () => {
        const property = pm.response.json().property;
        pm.expect(property.photo_count).to.be.above(0);
        pm.expect(property.cover_photo_url).to.be.a("string");
      });
    language: text/javascript
order: 11000
