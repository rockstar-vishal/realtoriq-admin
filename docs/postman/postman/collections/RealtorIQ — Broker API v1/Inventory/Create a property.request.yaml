$kind: http-request
description: |-
  Required: `building_id`, `typology_id`, `listing_for`, `price`. The city comes through the building.

  `confidential_note` holds owner details and negotiating room. The design puts it behind a reveal so it can't appear on a client's screen by accident — the API keeps it out of every list payload and out of `shareable`.
url: "{{api_base}}/properties"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "building_id": "{{building_id}}",
      "typology_id": "{{typology_id}}",
      "listing_for": "sale",
      "price": 11800000,
      "carpet_area_sqft": 690,
      "floor_band": "middle",
      "available_from": "2026-10-01",
      "description": "Corner flat, cross-ventilated.",
      "confidential_note": "Owner: Mr R. Bhatt \u00b7 negotiable to \u20b91.14 Cr"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));

      const property = pm.response.json().property;
      pm.collectionVariables.set("property_id", property.id);

      pm.test("derives the title and the rate", () => {
        pm.expect(property.title).to.be.a("string");
        pm.expect(property.rate_per_sqft).to.eql(17101);
      });
    language: text/javascript
order: 9000
