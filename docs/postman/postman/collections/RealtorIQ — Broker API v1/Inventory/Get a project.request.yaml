$kind: http-request
description: |-
  Detail adds the typology table with a rate per sqft each, the brochure, photo urls, and a **`shareable`** subset.

  `shareable` deliberately omits `brokerage_percent` — what the broker earns is not the client's business. Build share messages from `shareable` rather than the top-level object.
url: "{{api_base}}/projects/{{project_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const project = pm.response.json().project;

      pm.test("shareable hides what the broker earns", () => {
        pm.expect(project).to.have.property("brokerage_percent");
        pm.expect(project.shareable).to.not.have.property("brokerage_percent");
      });
    language: text/javascript
order: 7000
