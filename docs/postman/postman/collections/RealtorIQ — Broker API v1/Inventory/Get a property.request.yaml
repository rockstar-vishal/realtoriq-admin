$kind: http-request
description: The only response that carries `confidential_note`. `shareable` holds exactly what may go to a client — build share text from it and the note cannot leak by accident.
url: "{{api_base}}/properties/{{property_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const property = pm.response.json().property;

      pm.test("detail carries the note", () => {
        pm.expect(property).to.have.property("confidential_note");
      });

      pm.test("shareable does not", () => {
        pm.expect(property.shareable).to.not.have.property("confidential_note");
      });
    language: text/javascript
order: 10000
