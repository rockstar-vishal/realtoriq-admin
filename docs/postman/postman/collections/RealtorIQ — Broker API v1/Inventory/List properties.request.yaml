$kind: http-request
description: |-
  Filters: `q`, `listing_for`, `city_id`, `locality_id`, `building_id`, `typology_id`, `floor_band`, `price_min`, `price_max`, `status`.

  `price` is the sale price, or the **monthly rent** when `listing_for` is `rent` — so `rate_per_sqft` on a rental is rent per sqft per month.

  **`confidential_note` is never in this payload.**
url: "{{api_base}}/properties"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const properties = pm.response.json().properties;
      if (properties.length) pm.collectionVariables.set("property_id", properties[0].id);

      pm.test("no confidential note in a list", () => {
        properties.forEach((p) => pm.expect(p).to.not.have.property("confidential_note"));
      });
    language: text/javascript
order: 8000
