$kind: http-request
description: |-
  Detail payload: the lead, its typologies, its recent timeline and its full status history.

  Note the lead **detail screen was never designed** — this shape is inferred from the list card and the new-lead form, and will likely change when that screen exists.
url: "{{api_base}}/leads/{{lead_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      pm.test("carries the timeline and history", () => {
        const lead = pm.response.json().lead;
        pm.expect(lead.activities).to.be.an("array");
        pm.expect(lead.status_history).to.be.an("array");
      });
    language: text/javascript
order: 4000
