$kind: http-request
description: |-
  Kinds: `call`, `whatsapp`, `visit`, `note`. `status_change` is system-only and refused here — pipeline movement goes through the status endpoint, which also writes the reporting record.

  `occurred_at` is optional and defaults to now, so a broker can log this evening the call they made this morning.
url: "{{api_base}}/leads/{{lead_id}}/activities"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "kind": "call",
      "body": "Discussed the 3 BHK; wants a Saturday visit",
      "outcome": "interested"
    }
scripts:
  - type: afterResponse
    code: pm.test("201 Created", () => pm.response.to.have.status(201));
    language: text/javascript
order: 6000
