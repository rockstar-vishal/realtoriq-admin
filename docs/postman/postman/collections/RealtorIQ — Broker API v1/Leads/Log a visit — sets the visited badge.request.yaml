$kind: http-request
description: A visit is what makes the design's "visited" badge true. It's derived from the timeline rather than set separately, so the two can't disagree. The response returns the updated lead so the client can refresh without a second request.
url: "{{api_base}}/leads/{{lead_id}}/activities"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "kind": "visit",
      "body": "Site visit to Aurum Vista"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));

      pm.test("the lead now reads as visited", () => {
        pm.expect(pm.response.json().lead.visited).to.be.true;
      });
    language: text/javascript
order: 7000
