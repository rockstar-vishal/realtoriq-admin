$kind: http-request
description: Deliberately refused. A lead marked dead with no reason is a lead nobody can learn from, and the dead-leads report exists to answer "why".
url: "{{api_base}}/leads/{{lead_id}}/status"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "dead"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("422 reason_required", () => {
        pm.response.to.have.status(422);
        pm.expect(pm.response.json().error.code).to.eql("reason_required");
      });
    language: text/javascript
order: 9000
