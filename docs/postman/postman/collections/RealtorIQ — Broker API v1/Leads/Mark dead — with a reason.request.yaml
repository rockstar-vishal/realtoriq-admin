$kind: http-request
description: |-
  Writes three things in one transaction: the lead's status, a `lead_status_changes` row (which is what the dead-leads report groups by month), and a timeline entry.

  Reviving the lead afterwards clears `dead_reason` and `dead_at`.
url: "{{api_base}}/leads/{{lead_id}}/status"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "dead",
      "reason": "Bought through another channel partner"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      pm.test("records the reason and the history", () => {
        const lead = pm.response.json().lead;
        pm.expect(lead.dead_reason).to.be.a("string");
        pm.expect(lead.dead_at).to.not.be.null;
        pm.expect(lead.status_history.length).to.be.at.least(2);
      });
    language: text/javascript
order: 10000
