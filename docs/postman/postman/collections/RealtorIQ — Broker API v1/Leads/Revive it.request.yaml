$kind: http-request
description: Clears the death details — otherwise a revived lead still reads as dead everywhere it's shown.
url: "{{api_base}}/leads/{{lead_id}}/status"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "hot"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      pm.test("death details cleared", () => {
        const lead = pm.response.json().lead;
        pm.expect(lead.dead_reason).to.be.null;
        pm.expect(lead.dead_at).to.be.null;
      });
    language: text/javascript
order: 11000
