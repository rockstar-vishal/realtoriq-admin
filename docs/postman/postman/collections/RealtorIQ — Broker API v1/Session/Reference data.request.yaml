$kind: http-request
description: |-
  Every dropdown the app needs, in one request: cities, localities, builders, typologies, lead sources, lead statuses, property types, plus the fixed transaction-type and floor-band enums.

  Global data, identical for every firm, so it carries an **ETag**. Send `If-None-Match` and you get a 304 instead of the payload — cheap to revalidate on every app launch.

  Note `lead_statuses[].is_dead` / `is_booked`: those flags are what make the dead-leads and bookings reports computable without hardcoding status names.
url: "{{api_base}}/reference"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const body = pm.response.json();

      pm.test("carries every master the app needs", () => {
        ["cities", "localities", "builders", "typologies",
         "lead_sources", "lead_statuses", "property_types"].forEach((key) => {
          pm.expect(body[key], key).to.be.an("array").that.is.not.empty;
        });
      });

      pm.test("lead statuses carry the report flags", () => {
        pm.expect(body.lead_statuses.some((s) => s.is_dead)).to.be.true;
        pm.expect(body.lead_statuses.some((s) => s.is_booked)).to.be.true;
      });

      pm.test("is cacheable", () => {
        // Header lookup is case-sensitive in Newman, and Puma emits `etag`.
        const etag = pm.response.headers.get("ETag") || pm.response.headers.get("etag");
        pm.expect(etag).to.be.a("string");
      });
    language: text/javascript
order: 2000
