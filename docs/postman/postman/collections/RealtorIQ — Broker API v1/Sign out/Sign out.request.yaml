$kind: http-request
description: |-
  Always 204, whether or not that token was live — whether a token exists is not something an unauthenticated caller needs told.

  Revokes the session, so the access token stops working on the very next request rather than when it expires.
url: "{{api_base}}/auth/session"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refresh_token": "{{refresh_token}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("204 No Content", () => pm.response.to.have.status(204));
    language: text/javascript
order: 1000
