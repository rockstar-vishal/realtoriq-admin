$kind: http-request
url: "{{api_base}}/auth/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"mobile":"9999999999"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 not_registered — there is no self-signup', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error.code).to.eql('not_registered');
      });
    language: text/javascript
order: 4000
