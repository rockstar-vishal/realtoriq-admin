$kind: http-request
url: "{{api_base}}/auth/session"
method: DELETE
headers:
  Content-Type: application/json
  Authorization: Bearer {{check_access_token}}
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: pm.test('204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 4000
